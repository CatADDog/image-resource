<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <filter id="glow-green"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4ade80" flood-opacity="0.4"/></filter>
    <filter id="glow-blue"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#60a5fa" flood-opacity="0.4"/></filter>
    <filter id="glow-purple"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c084fc" flood-opacity="0.4"/></filter>
    <filter id="glow-orange"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fb923c" flood-opacity="0.4"/></filter>
    <filter id="glow-cyan"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22d3ee" flood-opacity="0.4"/></filter>
    <filter id="glow-red"><feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f87171" flood-opacity="0.35"/></filter>

    <marker id="arr-g" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#4ade80"/></marker>
    <marker id="arr-b" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#60a5fa"/></marker>
    <marker id="arr-p" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#c084fc"/></marker>
    <marker id="arr-o" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#fb923c"/></marker>
    <marker id="arr-c" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#22d3ee"/></marker>
    <marker id="arr-dim" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#475569"/></marker>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#1a1f30" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- BG -->
  <rect width="960" height="620" fill="#0c0e14" rx="12"/>
  <rect width="960" height="620" fill="url(#grid)" rx="12"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#22d3ee">GPU Insight 数据采集链路</text>

  <!-- ══ COL 1: Exporters ══ -->
  <text x="140" y="62" fill="#475569" font-size="10" text-anchor="middle" letter-spacing="0.12em">K8S WORKER NODE</text>

  <!-- nvmlproc -->
  <rect x="30" y="78" width="220" height="82" rx="10" fill="#151823" stroke="#4ade80" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="140" y="104" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">nvmlproc-exporter</text>
  <text x="140" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">per-PID GPU Metrics</text>
  <text x="140" y="140" fill="#64748b" font-size="9.5" text-anchor="middle">SM% · MemMiB · Enc · Dec</text>

  <!-- dcgm -->
  <rect x="30" y="186" width="220" height="82" rx="10" fill="#151823" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="140" y="212" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">dcgm-exporter</text>
  <text x="140" y="230" fill="#94a3b8" font-size="10" text-anchor="middle">MIG Instance Metrics</text>
  <text x="140" y="248" fill="#64748b" font-size="9.5" text-anchor="middle">GPU_I_ID · SmActive · FbUsed</text>

  <!-- volcano -->
  <rect x="30" y="294" width="220" height="82" rx="10" fill="#151823" stroke="#c084fc" stroke-width="1.5" filter="url(#glow-purple)"/>
  <text x="140" y="320" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">volcano-vgpu-plugin</text>
  <text x="140" y="338" fill="#94a3b8" font-size="10" text-anchor="middle">Pod ↔ GPU Allocation</text>
  <text x="140" y="356" fill="#64748b" font-size="9.5" text-anchor="middle">devID · Cores% · MemMiB</text>

  <!-- ══ COL 2: Prometheus ══ -->
  <rect x="320" y="155" width="140" height="140" rx="70" fill="#151823" stroke="#fb923c" stroke-width="1.5" filter="url(#glow-orange)"/>
  <text x="390" y="218" fill="#fb923c" font-size="14" font-weight="bold" text-anchor="middle">Prometheus</text>
  <text x="390" y="238" fill="#94a3b8" font-size="10" text-anchor="middle">TSDB</text>
  <text x="390" y="254" fill="#64748b" font-size="10" text-anchor="middle">PromQL</text>

  <!-- ══ COL 3: Monitor ══ -->
  <rect x="530" y="68" width="230" height="320" rx="12" fill="#151823" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="645" y="94" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">monitor (Go)</text>
  <text x="645" y="112" fill="#64748b" font-size="10" text-anchor="middle">每 5 秒一轮采集</text>

  <rect x="548" y="126" width="194" height="34" rx="6" fill="#1a2030" stroke="#252a3a" stroke-width="1"/>
  <text x="645" y="148" fill="#4ade80" font-size="11" text-anchor="middle">① Query nvmlproc</text>

  <rect x="548" y="170" width="194" height="34" rx="6" fill="#1a2030" stroke="#252a3a" stroke-width="1"/>
  <text x="645" y="192" fill="#60a5fa" font-size="11" text-anchor="middle">② Query DCGM MIG</text>

  <rect x="548" y="214" width="194" height="34" rx="6" fill="#1a2030" stroke="#252a3a" stroke-width="1"/>
  <text x="645" y="236" fill="#c084fc" font-size="11" text-anchor="middle">③ Query Volcano alloc</text>

  <rect x="548" y="258" width="194" height="34" rx="6" fill="#1a2030" stroke="#252a3a" stroke-width="1"/>
  <text x="645" y="280" fill="#fb923c" font-size="11" text-anchor="middle">④ Sticky MIG Assign</text>

  <rect x="548" y="302" width="194" height="34" rx="6" fill="#1a2030" stroke="#252a3a" stroke-width="1"/>
  <text x="645" y="324" fill="#22d3ee" font-size="11" text-anchor="middle">⑤ Build Snapshots</text>

  <text x="645" y="360" fill="#64748b" font-size="9.5" text-anchor="middle">NodeSummary · PodDetail · GPUMeta</text>

  <!-- ══ COL 4: Redis ══ -->
  <rect x="830" y="140" width="110" height="170" rx="10" fill="#151823" stroke="#f87171" stroke-width="1.5" filter="url(#glow-red)"/>
  <text x="885" y="172" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">Redis</text>

  <rect x="844" y="188" width="82" height="22" rx="4" fill="#1a2030" stroke="#252a3a"/>
  <text x="885" y="204" fill="#4ade80" font-size="10" text-anchor="middle">A : Node</text>

  <rect x="844" y="218" width="82" height="22" rx="4" fill="#1a2030" stroke="#252a3a"/>
  <text x="885" y="234" fill="#60a5fa" font-size="10" text-anchor="middle">B : Pod</text>

  <rect x="844" y="248" width="82" height="22" rx="4" fill="#1a2030" stroke="#252a3a"/>
  <text x="885" y="264" fill="#c084fc" font-size="10" text-anchor="middle">C : Meta</text>

  <text x="885" y="298" fill="#64748b" font-size="9" text-anchor="middle">zstd + msgpack</text>

  <!-- ══ ARROWS: Exporters → Prometheus ══ -->
  <path d="M250,119 C290,119 295,200 318,205" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-g)"/>
  <path d="M250,227 L318,227" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-b)"/>
  <path d="M250,335 C290,335 295,255 318,250" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arr-p)"/>

  <text x="283" y="156" fill="#4ade80" font-size="8" transform="rotate(-28,283,156)" opacity="0.7">scrape</text>
  <text x="283" y="220" fill="#60a5fa" font-size="8" opacity="0.7">scrape</text>
  <text x="283" y="302" fill="#c084fc" font-size="8" transform="rotate(28,283,302)" opacity="0.7">scrape</text>

  <!-- Prom → Monitor -->
  <path d="M460,225 L528,225" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="494" y="218" fill="#fb923c" font-size="9" text-anchor="middle" opacity="0.8">PromQL</text>

  <!-- Monitor → Redis -->
  <path d="M760,225 L828,225" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-c)"/>
  <text x="794" y="216" fill="#22d3ee" font-size="9" text-anchor="middle" opacity="0.8">SET</text>

  <!-- ══ DOWNSTREAM ══ -->
  <text x="480" y="440" fill="#475569" font-size="10" text-anchor="middle" letter-spacing="0.15em">DOWNSTREAM CONSUMERS</text>
  <line x1="180" y1="448" x2="780" y2="448" stroke="#252a3a" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="130" y="466" width="200" height="62" rx="10" fill="#151823" stroke="#252a3a"/>
  <text x="230" y="494" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">vgpu-rightsizer</text>
  <text x="230" y="514" fill="#64748b" font-size="10" text-anchor="middle">资源建议 · 缩放决策</text>

  <rect x="380" y="466" width="200" height="62" rx="10" fill="#151823" stroke="#252a3a"/>
  <text x="480" y="494" fill="#fb923c" font-size="12" font-weight="bold" text-anchor="middle">API / Dashboard</text>
  <text x="480" y="514" fill="#64748b" font-size="10" text-anchor="middle">可视化 · 报警</text>

  <rect x="630" y="466" width="200" height="62" rx="10" fill="#151823" stroke="#252a3a"/>
  <text x="730" y="494" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">MIG Planner</text>
  <text x="730" y="514" fill="#64748b" font-size="10" text-anchor="middle">MIG 实例重规划</text>

  <!-- Redis → downstream -->
  <path d="M885,312 L885,420 Q885,438 867,438 L230,438 L230,464" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dim)" opacity="0.5"/>
  <path d="M885,312 L885,420 Q885,438 867,438 L480,438 L480,464" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dim)" opacity="0.5"/>
  <path d="M885,312 L885,420 Q885,438 867,438 L730,438 L730,464" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-dim)" opacity="0.5"/>

  <!-- ══ BOTTOM KEY MAPPING ══ -->
  <rect x="130" y="555" width="700" height="44" rx="8" fill="#1a2030" stroke="#252a3a"/>
  <text x="480" y="576" text-anchor="middle" font-size="11" fill="#94a3b8">
    <tspan fill="#c084fc">Pod</tspan>
    <tspan fill="#475569"> ──[devID]──▸ </tspan>
    <tspan fill="#4ade80">GPU UUID</tspan>
    <tspan fill="#475569"> ──[GPU_I_ID]──▸ </tspan>
    <tspan fill="#60a5fa">MIG Instance</tspan>
    <tspan fill="#475569"> ──[sticky]──▸ </tspan>
    <tspan fill="#fb923c">Actual Utilization</tspan>
  </text>
  <text x="480" y="593" fill="#64748b" font-size="9" text-anchor="middle">核心映射链路：Volcano devID 绑定 GPU → DCGM GPU_I_ID 定位 MIG 实例 → 粘性算法配对 Pod</text>

  <!-- Legend -->
  <circle cx="178" cy="15" r="4" fill="#4ade80"/><text x="188" y="19" fill="#64748b" font-size="9">nvmlproc</text>
  <circle cx="270" cy="15" r="4" fill="#60a5fa"/><text x="280" y="19" fill="#64748b" font-size="9">DCGM</text>
  <circle cx="340" cy="15" r="4" fill="#c084fc"/><text x="350" y="19" fill="#64748b" font-size="9">Volcano</text>
  <circle cx="425" cy="15" r="4" fill="#fb923c"/><text x="435" y="19" fill="#64748b" font-size="9">Prometheus</text>
  <circle cx="530" cy="15" r="4" fill="#22d3ee"/><text x="540" y="19" fill="#64748b" font-size="9">Monitor</text>
  <circle cx="610" cy="15" r="4" fill="#f87171"/><text x="620" y="19" fill="#64748b" font-size="9">Redis</text>
</svg>
